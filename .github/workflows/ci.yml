name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test installer storage-path handling
        run: bash deploy/tests/test_install.sh
      - name: Validate deployment Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Check quoted storage paths through Compose
        run: bash deploy/tests/test_compose_env.sh
      - name: Validate source-build Compose configuration
        run: docker compose --project-directory . -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml config --quiet
      - name: Build image (no push)
        run: docker build -f deploy/Dockerfile -t unifierr:ci .
      - name: Smoke test the production container
        run: |
          set -euo pipefail
          container=unifierr-ci
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" --publish 127.0.0.1::8484 --env UNIFIERR_DOCKER_HOST= unifierr:ci
          host_port=$(docker port "$container" 8484/tcp | sed 's/.*://')
          for attempt in $(seq 1 45); do
            if curl --fail --silent "http://127.0.0.1:$host_port/api/health" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:$host_port/api/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:$host_port/" | grep -qi '<div id="root"'
