name: Build Unifierr device clients

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: npm ci
        working-directory: client
      - run: npm run build:windows
        working-directory: client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unifierr-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: npm ci
        working-directory: client
      - run: npm run build:macos
        working-directory: client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unifierr-macos
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: client
      - run: npx tauri android init --ci
        working-directory: client
      - name: Unifierr Android layout (system bars) and launcher icon
        run: |
          cp android/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/unifierr/client/MainActivity.kt
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/  # Unifierr launcher icon
        working-directory: client
      - run: npx tauri android build --debug --apk --target aarch64
        working-directory: client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unifierr-android
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish-preview:
    name: Publish private client preview
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's client builds
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package installers and checksums
        run: |
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import shutil

          version = os.environ["GITHUB_REF_NAME"].removeprefix("client-v")
          root = Path("artifacts")
          output = Path("release-assets")
          output.mkdir()
          wanted = {
              ".exe": f"unifierr-windows-preview-{version}.exe",
              ".dmg": f"unifierr-macos-preview-{version}.dmg",
          }
          for suffix, name in wanted.items():
              matches = list(root.rglob(f"*{suffix}"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {suffix} build, found {len(matches)}")
              shutil.copy2(matches[0], output / name)

          apks = list(root.rglob("*.apk"))
          arm64 = [path for path in apks if "arm64" in path.name.lower() or "aarch64" in path.name.lower()]
          if arm64:
              apks = arm64
          if len(apks) != 1:
              raise SystemExit(f"Expected one Android APK (or one arm64 APK), found {len(apks)}")
          shutil.copy2(apks[0], output / f"unifierr-android-arm64-preview-{version}.apk")

          entries = []
          for path in sorted(output.iterdir()):
              digest = sha256()
              with path.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(block)
              entries.append(f"{digest.hexdigest()}  {path.name}")
          (output / "SHA256SUMS.txt").write_text("\n".join(entries) + "\n", encoding="utf-8")
          PY
      - name: Publish prerelease assets
        run: |
          version="${GITHUB_REF_NAME#client-v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* \
            --title "Unifierr client preview ${version}" \
            --notes "Preview builds for private testing. Windows and macOS packages are unsigned; Android is an ARM64 debug APK. The server must already be running and reachable over HTTPS." \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
