server {
    listen 80;
    listen [::]:80;
    server_name unifierr.skillsgeek.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name unifierr.skillsgeek.com;
    root /var/www/unifierr/current;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/unifierr.skillsgeek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unifierr.skillsgeek.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /downloads/ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
